
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GATE ECE | Student Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fc;color:#17243a;font-family:Arial,sans-serif}
header{background:#101d38;color:white;padding:22px 6%;display:flex;justify-content:space-between;align-items:center}
main{max-width:1050px;margin:35px auto;padding:0 18px}
.welcome{background:linear-gradient(120deg,#142d55,#2469b5);color:white;padding:30px;border-radius:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:24px}
.card{background:white;padding:22px;border-radius:14px;box-shadow:0 5px 20px #17243a12}
button{background:#2469b5;color:white;border:0;padding:12px 18px;border-radius:8px;cursor:pointer}
small{color:#718096}
</style>
</head>
<body>
<header>
  <strong>GATE ECE EXAM PORTAL</strong>
  <button onclick="logout()">Logout</button>
</header>
<main>
  <section class="welcome">
    <h1>Student Dashboard</h1>
    <p>Welcome, <span id="studentID">Student</span></p>
    <p>Prepare. Practice. Perform.</p>
  </section>
  <section class="grid">
    <div class="card">
      <h3>Available Exams</h3>
      <p>View published GATE ECE exams.</p>
      <button onclick="location.href='subjects.html'">View Exams</button>
    </div>
    <div class="card">
      <h3>My Results</h3>
      <p>Check your examination scores.</p>
      <button onclick="location.href='analytics.html'">View Results</button>
    </div>
    <div class="card">
      <h3>Wrong Questions</h3>
      <p>Review your incorrect answers.</p>
      <button onclick="location.href='wrong-questions.html'">Review</button>
    </div>
    <div class="card">
      <h3>Bookmarks</h3>
      <p>View your saved questions.</p>
      <button onclick="location.href='bookmarks.html'">Open</button>
    </div>
  </section>
</main>
<script>
const id=sessionStorage.getItem("gate_user_id");
const role=sessionStorage.getItem("gate_role");

if(!id || !["GATE001","GATE002"].includes(id) || role!=="student"){
  location.replace("login.html");
}else{
  document.getElementById("studentID").textContent=id;
}
function logout(){
  sessionStorage.clear();
  location.href="login.html";
}
</script>
</body>
</html>
