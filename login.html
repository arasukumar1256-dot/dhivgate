
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GATE ECE Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-container">
    <h1>GATE ECE Portal</h1>
    <p>Enter your student ID to continue</p>

    <form id="loginForm">
      <label for="userId">User ID</label>
      <input
        type="text"
        id="userId"
        placeholder="Example: GATE001"
        required
      >
      <button type="submit">Sign In</button>
    </form>

    <p id="message"></p>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const id = document.getElementById("userId").value.trim().toUpperCase();

      if (id === "GATE001" || id === "GATE002") {
        sessionStorage.setItem("gate_user_id", id);
        sessionStorage.setItem("gate_role", "student");
        window.location.href = "dashboard.html";
      } else if (id === "ADMIN001") {
        sessionStorage.setItem("gate_user_id", id);
        sessionStorage.setItem("gate_role", "host");
        window.location.href = "admin/dashboard.html";
      } else {
        document.getElementById("message").textContent =
          "Invalid ID. Please check your ID.";
      }
    });
  </script>
</body>
</html>
